[workspace]
members = [
    "crates/primitives",
    "crates/consensus",
    "crates/validation",
    "crates/network",
    "crates/wallet",
    "crates/node",
    "crates/script",
]
resolver = "2"

[workspace.dependencies]
bitcoin = "0.32"
bitcoin_hashes = "0.14"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
thiserror = "1.0"
